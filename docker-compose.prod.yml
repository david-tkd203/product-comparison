services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5000:5000"          # Solo localhost; usar reverse proxy (nginx/caddy) en prod
    volumes:
      - uploads:/app/uploads
      - tunnel_data:/app/tunnel
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - TUNNEL_URL_FILE=${TUNNEL_URL_FILE}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpass}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    volumes:
      - mysqldata:/var/lib/mysql
      - ./backups:/backups                       # Para dumps de backup
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  tunnel:
    image: debian:bookworm-slim
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - tunnel_data:/tmp/tunnel
      - ./tunnel-entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      - web
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

volumes:
  mysqldata:
    driver: local
  uploads:
    driver: local
  tunnel_data:
    driver: local
