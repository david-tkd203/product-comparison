services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    volumes:
      - uploads:/app/uploads
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dokploy-network
    # Labels a nivel de contenedor (provider Docker de Traefik)
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.siyash-web.rule=Host(`siyash.cl`) || Host(`www.siyash.cl`)"
      - "traefik.http.routers.siyash-web.entrypoints=websecure"
      - "traefik.http.routers.siyash-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.siyash-web.service=siyash-web"
      - "traefik.http.routers.siyash-web-http.rule=Host(`siyash.cl`) || Host(`www.siyash.cl`)"
      - "traefik.http.routers.siyash-web-http.entrypoints=web"
      - "traefik.http.routers.siyash-web-http.service=siyash-web"
      - "traefik.http.middlewares.siyash-web-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.siyash-web-http.middlewares=siyash-web-redirect"
      - "traefik.http.services.siyash-web.loadbalancer.server.port=80"
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
        parallelism: 1
      rollback_config:
        order: start-first
        parallelism: 1
      # Labels a nivel de servicio Swarm (provider Swarm de Traefik)
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=dokploy-network"
        - "traefik.http.routers.siyash-web-swarm.rule=Host(`siyash.cl`) || Host(`www.siyash.cl`)"
        - "traefik.http.routers.siyash-web-swarm.entrypoints=websecure"
        - "traefik.http.routers.siyash-web-swarm.tls.certresolver=letsencrypt"
        - "traefik.http.routers.siyash-web-swarm.service=siyash-web-swarm"
        - "traefik.http.routers.siyash-web-swarm-http.rule=Host(`siyash.cl`) || Host(`www.siyash.cl`)"
        - "traefik.http.routers.siyash-web-swarm-http.entrypoints=web"
        - "traefik.http.routers.siyash-web-swarm-http.service=siyash-web-swarm"
        - "traefik.http.middlewares.siyash-web-swarm-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.siyash-web-swarm-http.middlewares=siyash-web-swarm-redirect"
        - "traefik.http.services.siyash-web-swarm.loadbalancer.server.port=80"
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpass}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    volumes:
      - mysqldata:/var/lib/mysql

    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  mysqldata:
    driver: local
  uploads:
    driver: local

networks:
  dokploy-network:
    external: true
