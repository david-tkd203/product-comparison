services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "5000"
    volumes:
      - uploads:/app/uploads
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-cambiar-en-produccion}
      - MYSQL_HOST=db
      - MYSQL_USER=perfumes
      - MYSQL_PASSWORD=perfumes
      - MYSQL_DATABASE=perfumes
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_USER=perfumes
      - MYSQL_PASSWORD=perfumes
      - MYSQL_DATABASE=perfumes
    volumes:
      - mysqldata:/var/lib/mysql
      - ./backups:/backups
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  nginx:
    image: nginx:alpine
    ports:
      - "5000:5000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

volumes:
  mysqldata:
    driver: local
  uploads:
    driver: local
