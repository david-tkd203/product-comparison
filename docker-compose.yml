services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./tunnel_data:/app/tunnel
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-cambiar-en-produccion}
      - MYSQL_HOST=db
      - MYSQL_USER=perfumes
      - MYSQL_PASSWORD=perfumes
      - MYSQL_DATABASE=perfumes
      - TUNNEL_URL_FILE=/app/tunnel/url.txt
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_USER=perfumes
      - MYSQL_PASSWORD=perfumes
      - MYSQL_DATABASE=perfumes
    volumes:
      - mysqldata:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  tunnel:
    image: debian:bookworm-slim
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./tunnel_data:/tmp/tunnel
      - ./tunnel-entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  mysqldata:
