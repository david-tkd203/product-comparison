{% macro filtros() %}
<form method="get" class="space-y-8 bg-brand-white border border-brand-100 p-6 shadow-sm">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

  <!-- Búsqueda -->
  <div>
    <label class="block text-[10px] tracking-widest2 uppercase text-brand-400 mb-2">Buscar</label>
    <div class="flex border border-brand-200 focus-within:border-brand-black transition-colors">
      <input type="text" name="q" value="{{ q }}" placeholder="Perfume, marca o SKU…" class="flex-1 min-w-0 px-3 py-2.5 text-sm bg-brand-white focus:outline-none">
      <button type="submit" class="px-3 text-brand-400 hover:text-brand-black transition-colors" aria-label="Buscar">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-5.2-5.2m2.2-5.3a7.5 7.5 0 11-15 0 7.5 7.5 0 0115 0z"/></svg>
      </button>
    </div>
  </div>

  <!-- Género -->
  {% if not preset %}
  <div>
    <span class="block text-[10px] tracking-widest2 uppercase text-brand-400 mb-3 border-b border-brand-100 pb-2">Género</span>
    <div class="space-y-2">
      <label class="flex items-center gap-3 cursor-pointer group">
        <input type="radio" name="genero" value="" class="accent-brand-black w-3 h-3" {{ 'checked' if not genero }}>
        <span class="text-xs text-brand-600 group-hover:text-brand-black transition-colors {{ 'font-medium text-brand-black' if not genero }}">Todos</span>
      </label>
      <label class="flex items-center gap-3 cursor-pointer group">
        <input type="radio" name="genero" value="Mujer" class="accent-brand-black w-3 h-3" {{ 'checked' if genero == 'Mujer' }}>
        <span class="text-xs text-brand-600 group-hover:text-brand-black transition-colors {{ 'font-medium text-brand-black' if genero == 'Mujer' }}">Para Ella</span>
      </label>
      <label class="flex items-center gap-3 cursor-pointer group">
        <input type="radio" name="genero" value="Hombre" class="accent-brand-black w-3 h-3" {{ 'checked' if genero == 'Hombre' }}>
        <span class="text-xs text-brand-600 group-hover:text-brand-black transition-colors {{ 'font-medium text-brand-black' if genero == 'Hombre' }}">Para Él</span>
      </label>
      <label class="flex items-center gap-3 cursor-pointer group">
        <input type="radio" name="genero" value="Unisex" class="accent-brand-black w-3 h-3" {{ 'checked' if genero == 'Unisex' }}>
        <span class="text-xs text-brand-600 group-hover:text-brand-black transition-colors {{ 'font-medium text-brand-black' if genero == 'Unisex' }}">Unisex</span>
      </label>
    </div>
  </div>
  {% endif %}

  <!-- Marca -->
  <div>
    <span class="block text-[10px] tracking-widest2 uppercase text-brand-400 mb-3 border-b border-brand-100 pb-2">Casas de Perfumería</span>
    <div class="space-y-2 max-h-52 overflow-y-auto pr-2 custom-scrollbar">
      <label class="flex items-center gap-3 cursor-pointer group">
        <input type="radio" name="linea" value="" class="accent-brand-black w-3 h-3" {{ 'checked' if not linea }}>
        <span class="text-xs text-brand-600 group-hover:text-brand-black transition-colors {{ 'font-medium text-brand-black' if not linea }}">Todas las casas</span>
      </label>
      {% for l in lineas %}
      <label class="flex items-center gap-3 cursor-pointer group">
        <input type="radio" name="linea" value="{{ l }}" class="accent-brand-black w-3 h-3" {{ 'checked' if linea == l }}>
        <span class="text-xs text-brand-600 group-hover:text-brand-black transition-colors {{ 'font-medium text-brand-black' if linea == l }}">{{ l }}</span>
      </label>
      {% endfor %}
    </div>
  </div>

  <!-- Familia olfativa -->
  <div>
    <span class="block text-[10px] tracking-widest2 uppercase text-brand-400 mb-3 border-b border-brand-100 pb-2">Familia olfativa</span>
    <div class="space-y-2 max-h-40 overflow-y-auto pr-2 custom-scrollbar">
      <label class="flex items-center gap-3 cursor-pointer group">
        <input type="radio" name="familia" value="" class="accent-brand-black w-3 h-3" {{ 'checked' if not familia }}>
        <span class="text-xs text-brand-600 group-hover:text-brand-black transition-colors {{ 'font-medium text-brand-black' if not familia }}">Todas las familias</span>
      </label>
      {% for f in familias %}
      <label class="flex items-center gap-3 cursor-pointer group">
        <input type="radio" name="familia" value="{{ f }}" class="accent-brand-black w-3 h-3" {{ 'checked' if familia == f }}>
        <span class="text-xs text-brand-600 group-hover:text-brand-black transition-colors {{ 'font-medium text-brand-black' if familia == f }}">{{ f }}</span>
      </label>
      {% endfor %}
    </div>
  </div>

  <!-- Precio -->
  <div>
    <span class="block text-[10px] tracking-widest2 uppercase text-brand-400 mb-3 border-b border-brand-100 pb-2">Rango de Precio</span>
    <div class="flex items-center gap-2">
      <div class="relative w-full">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-brand-300 text-xs">$</span>
        <input type="number" name="pmin" value="{{ pmin or '' }}" min="0" placeholder="{{ bounds_min }}" class="w-full border border-brand-200 pl-7 pr-2 py-2 text-xs bg-brand-50 focus:bg-brand-white focus:outline-none focus:border-brand-black transition-colors">
      </div>
      <span class="text-brand-300 text-xs">—</span>
      <div class="relative w-full">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-brand-300 text-xs">$</span>
        <input type="number" name="pmax" value="{{ pmax or '' }}" min="0" placeholder="{{ bounds_max }}" class="w-full border border-brand-200 pl-7 pr-2 py-2 text-xs bg-brand-50 focus:bg-brand-white focus:outline-none focus:border-brand-black transition-colors">
      </div>
    </div>
  </div>

  {% if sort and sort != 'destacados' %}<input type="hidden" name="sort" value="{{ sort }}">{% endif %}

  <div class="flex gap-2">
    <button type="submit" class="flex-1 py-3 bg-brand-black text-brand-white text-[10px] tracking-widest2 uppercase hover:bg-brand-700 transition-colors">Aplicar</button>
    <a href="{{ '/hombre' if preset == 'Hombre' else '/mujer' if preset == 'Mujer' else '/perfumes' }}" class="px-4 py-3 border border-brand-200 text-[10px] tracking-widest2 uppercase text-brand-500 hover:border-brand-black hover:text-brand-black transition-colors">Limpiar</a>
  </div>
</form>
{% endmacro %}
