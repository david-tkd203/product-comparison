<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Sesión — Perfumería</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
</style>
</head>
<body class="h-full bg-slate-50 text-slate-800 antialiased flex items-center justify-center p-4">

<div class="w-full max-w-sm">
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-14 h-14 bg-indigo-600 rounded-2xl mb-4 shadow-lg">
      <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
    </div>
    <h1 class="text-2xl font-bold text-slate-900">Perfumería</h1>
    <p class="text-sm text-slate-500 mt-1">Panel de gestión</p>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="px-4 py-3 rounded-lg text-sm mb-4 {{ 'bg-emerald-50 text-emerald-700 border border-emerald-200' if category == 'success' else 'bg-red-50 text-red-700 border border-red-200' }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Usuario</label>
        <input type="text" name="username" required autofocus class="w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" placeholder="admin">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <input type="password" name="password" required class="w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" placeholder="••••••••">
      </div>
      <button type="submit" class="w-full px-4 py-2.5 bg-indigo-600 text-white text-sm font-semibold rounded-lg hover:bg-indigo-700 transition-colors shadow-sm">
        Iniciar sesión
      </button>
    </form>
  </div>

  <p class="text-center text-xs text-slate-400 mt-6">Perfumería Siyash · siyash.cl</p>
</div>

</body>
</html>
