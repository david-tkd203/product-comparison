{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold text-slate-900 mb-6">Subir Lista de Precios</h1>

<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 max-w-lg">
  <p class="text-sm text-slate-500 mb-4">Seleccioná el archivo Excel con el mismo formato que la lista mayorista.</p>
  <form method="post" enctype="multipart/form-data" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Archivo .xlsx</label>
      <input type="file" name="file" accept=".xlsx" required class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Fecha de precios</label>
      <input type="date" name="import_date" class="px-3 py-2 border border-slate-200 rounded-lg text-sm w-full focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>
    <button type="submit" class="w-full px-4 py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors">Importar</button>
  </form>
</div>
{% endblock %}
