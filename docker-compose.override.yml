services:
  web:
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-cambiar-en-produccion}
      - MYSQL_HOST=db
      - MYSQL_USER=perfumes
      - MYSQL_PASSWORD=perfumes
      - MYSQL_DATABASE=perfumes
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - TUNNEL_URL_FILE=/app/tunnel/url.txt

  nginx:
    image: nginx:alpine
    ports:
      - "5000:5000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
